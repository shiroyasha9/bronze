name: Bronze
options:
  bundleIdPrefix: tech.teensy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BronzeCore:
    path: Core

targets:
  Bronze:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: BronzeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.teensy.bronze
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Bronze Signing
        # Library validation rejects the previews debug dylib when signed
        # without a Team ID (self-signed cert).
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Bronze
        CFBundleDisplayName: Bronze
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tech.teensy.bronze.notes
            UTTypeDescription: Bronze Notes
            UTTypeConformsTo:
              - public.data
